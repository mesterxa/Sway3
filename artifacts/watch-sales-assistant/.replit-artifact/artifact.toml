kind = "mobile"
previewPath = "/"
title = "مساعد الساعات"
description = "تطبيق أندرويد عربي لمساعد بائع الساعات على حفظ الملاحظات، متابعة المواعيد والديون، وإدارة العملاء والمخزون من مكان واحد."
version = "1.0.0"
id = "artifacts/watch-sales-assistant"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20645

[services.development]
run = "pnpm --filter @workspace/watch-sales-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/watch-sales-assistant", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/watch-sales-assistant", "run", "serve" ]

[services.env]
PORT = "20645"
BASE_PATH = "/"
