openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Telegram assistant memory operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/telegram-status:
    get:
      operationId: getTelegramStatus
      tags: [assistant]
      summary: Get Telegram connection status
      responses:
        "200":
          description: Telegram connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
  /assistant/memory:
    get:
      operationId: getAssistantMemory
      tags: [assistant]
      summary: Get assistant memory
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Recent assistant memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMemorySummary"
  /assistant/command:
    post:
      operationId: sendAssistantCommand
      tags: [assistant]
      summary: Save a command from the website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "201":
          description: Saved memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "400":
          description: Invalid command
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TelegramStatus:
      type: object
      properties:
        connected:
          type: boolean
        botUsername:
          type: [string, "null"]
        lastUpdateAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
      required:
        - connected
        - botUsername
        - lastUpdateAt
        - lastError
    MemoryKind:
      type: string
      enum: [message, photo, file, reminder, debt, note]
    MemoryData:
      type: object
      properties:
        amount:
          type: number
        direction:
          type: string
          enum: [owedToMe, iOwe]
        title:
          type: string
        date:
          type: string
        fileId:
          type: string
        caption:
          type: string
        person:
          type: string
        archiveFileId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
    MemoryEntry:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        kind:
          $ref: "#/components/schemas/MemoryKind"
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/MemoryData"
      required: [id, chatId, kind, text, createdAt]
    AssistantMemorySummary:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntry"
        counts:
          type: object
          properties:
            reminders:
              type: number
              minimum: 0
            debts:
              type: number
              minimum: 0
            notes:
              type: number
              minimum: 0
            photos:
              type: number
              minimum: 0
          required: [reminders, debts, notes, photos]
      required: [entries, counts]
    CommandRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required: [text]

